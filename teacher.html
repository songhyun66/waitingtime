<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보건실 대기열 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/teacher.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="eyebrow">보건실 대기열 관리</div>
      <h1>우리학교 보건실 대시보드</h1>
    </div>
    <div class="status-clock">
      <a class="conn pending" id="conn" href="check.html" title="연결 점검 페이지 열기"><span class="dot"></span><span id="connText">연결 확인 중</span></a>
      <div id="clock">--:--:--</div>
    </div>
  </header>

  <div class="notice" id="notice"></div>

  <div class="summary">
    <div class="card primary">
      <div class="k">현재 예상 대기시간</div>
      <div class="v"><span id="totalWait">0</span><span>분</span></div>
      <svg class="ecg-bg" viewBox="0 0 140 50"><path d="M0,25 L30,25 L38,8 L48,42 L58,25 L140,25" /></svg>
    </div>
    <div class="card">
      <div class="k">대기 인원</div>
      <div class="v"><span id="waitCount">0</span><span>명</span></div>
      <svg class="ecg-bg" viewBox="0 0 140 50"><path d="M0,25 L30,25 L38,8 L48,42 L58,25 L140,25" /></svg>
    </div>
    <div class="card">
      <div class="k">오늘 누적 이용</div>
      <div class="v"><span id="todayTotal">0</span><span>명</span></div>
      <svg class="ecg-bg" viewBox="0 0 140 50"><path d="M0,25 L30,25 L38,8 L48,42 L58,25 L140,25" /></svg>
    </div>
  </div>

  <div class="section-head">
    <h2>대기 중인 학생</h2>
    <div class="hint">접수 순서대로 표시돼요</div>
  </div>
  <div class="queue-list" id="queueList">
    <div class="empty-state">현재 대기 중인 학생이 없습니다</div>
  </div>

  <div class="completed-toggle" id="completedToggle">
    <span class="arrow">▸</span>
    <span>오늘 처리 완료 (<span id="completedCount">0</span>명)</span>
  </div>
  <div class="completed-list" id="completedList"></div>

</div>

<!-- 파일을 더블클릭해서 열면(file://) ES 모듈이 로드되지 않으므로 안내를 띄웁니다 -->
<script>
  if (location.protocol === "file:"){
    document.body.insertAdjacentHTML("afterbegin",
      '<div class="file-warning">파일을 직접 열면(file://) 동작하지 않아요. README의 "실행하기"를 참고해 http:// 주소로 열어주세요.</div>');
  }
</script>
<script type="module" src="js/teacher.js"></script>
</body>
</html>
